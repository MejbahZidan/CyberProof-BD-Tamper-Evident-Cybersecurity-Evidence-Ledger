<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="cyberShieldGrad" x1="15%" y1="10%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldInnerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <path
    d="M60 14 C82 14 98 22 98 42 C98 76 74 97 60 106 C46 97 22 76 22 42 C22 22 38 14 60 14 Z"
    fill="url(#cyberShieldGrad)"
    opacity="0.35"
    filter="url(#softGlow)"
  />

  <!-- Main Shield Body -->
  <path
    d="M60 14 C82 14 98 22 98 42 C98 76 74 97 60 106 C46 97 22 76 22 42 C22 22 38 14 60 14 Z"
    fill="url(#cyberShieldGrad)"
  />

  <!-- Inner Highlight Rim -->
  <path
    d="M60 18 C79 18 93 25 93 42 C93 73 72 92 60 100 C48 92 27 73 27 42 C27 25 41 18 60 18 Z"
    fill="none"
    stroke="url(#shieldInnerGlow)"
    stroke-width="2.5"
  />

  <!-- Verification Checkmark -->
  <path
    d="M44 58 L54 68 L77 45"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
